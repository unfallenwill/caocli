[package]
name = "caocli-anthropic"
version = "0.1.0"
edition = "2024"
description = "A client for the Anthropic Messages API: the standard wire, as types and a stream"
license = "MIT"
repository = "https://github.com/unfallenwill/caocli"

[dependencies]
bytes = "1.12.1"
futures-util = "0.3.34"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "default-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6.5"

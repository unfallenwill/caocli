[package]
name = "caocli-mcp"
version = "0.0.0"
edition = "2024"
description = "Model Context Protocol client: external servers' tools, offered to the agent"
license = "MIT"
repository = "https://github.com/unfallenwill/caocli"
publish = false

[dependencies]
# Shared tool-definition type the request builder on the other side of the
# crate boundary knows.
caocli-core = { path = "../caocli-core" }
# HTTP transport (`url` entries) speaks through reqwest; stdio transport is
# plain tokio.
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "default-tls"] }
tokio = { version = "1.53.1", features = ["full"] }
futures-util = "0.3.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[dev-dependencies]
# HTTP transport tests spin up a `wiremock` server to assert on the JSON-RPC
# framing the client sends and the SSE framing it accepts back.
wiremock = "0.6.5"

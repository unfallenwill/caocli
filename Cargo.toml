[package]
name = "caocli"
version = "0.1.1"
edition = "2024"
description = "Terminal coding agent backed by DeepSeek or Zhipu GLM, with thinking mode and a Bash tool loop"
license = "MIT"
repository = "https://github.com/unfallenwill/caocli"

[dependencies]
anyhow = "1.0.104"
bytes = "1.12.1"
chrono = { version = "0.4.45", features = ["clock"] }
clap = { version = "4.6.6", features = ["derive"] }
crossterm = "0.29.0"
futures-util = "0.3.34"
ratatui = "0.30.2"
ratatui-textarea = "0.9.2"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "default-tls"] }
rustyline = "18.0.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
unicode-width = "0.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
wiremock = "0.6.5"

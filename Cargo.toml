[workspace]
members = [
    "crates/anthropic",
    "crates/caocli-core",
    "crates/caocli-mcp",
    "crates/openai",
]
resolver = "3"

[package]
name = "caocli"
version = "0.1.7"
edition = "2024"
description = "Terminal coding agent backed by DeepSeek, Zhipu GLM or MiniMax M3, with thinking mode and a Bash tool loop"
license = "MIT"
repository = "https://github.com/unfallenwill/caocli"

[dependencies]
# The Anthropic wire is its own crate: a standard Messages API client, so the
# protocol lives in one place and the agent is its first consumer (`anthropic`
# is the name it answers to here; the package is `caocli-anthropic`).
anthropic = { package = "caocli-anthropic", path = "crates/anthropic" }
# The OpenAI Chat Completions wire is its own crate: DeepSeek and Z.AI both
# speak the OpenAI shape with vendor extensions, and the SDK handles HTTP,
# retries, and SSE framing so the agent's only job is the delta stream.
openai = { package = "caocli-openai", path = "crates/openai" }
# Shared types: tool definitions, anything else more than one crate has to
# agree on. Kept tiny on purpose -- this is a dependency edge, not a shared
# lib, and crates that need richer surfaces own those surfaces themselves.
caocli-core = { path = "crates/caocli-core" }
# MCP client: external servers' tools, offered to the agent. Owns the JSON-RPC
# transports, the protocol-level handshake, and the routing from a tool name
# the model called to the server that offers it.
caocli-mcp = { path = "crates/caocli-mcp" }
# Markdown rendering for the answer and the thinking block. Pulled with no
# default features and only the extensions we render -- tables, strikethrough,
# task-list checkboxes -- so the binary stays small and there is no
# syntax-highlighting or HTML path we would have to ignore.
pulldown-cmark = { version = "0.13", default-features = false }
anyhow = "1.0.104"
bytes = "1.12.1"
chrono = { version = "0.4.45", features = ["clock"] }
clap = { version = "4.6.6", features = ["derive"] }
crossterm = "0.29.0"
futures-util = "0.3.34"
ratatui = "0.30.2"
ratatui-textarea = "0.9.2"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "default-tls"] }
# Transitive security floor: `reqwest`'s `default-tls` pulls in rustls, and
# RUSTSEC-2026-0285 (TLS 1.3 handshake messages crossing encryption-level
# boundaries) hit rustls < 0.23.45. Cargo's resolver is unified across the
# workspace, so a direct floor here pins the rustls version for every member.
rustls = "0.23.45"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10"
tokio = { version = "1.53.1", features = ["full"] }
unicode-width = "0.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
wiremock = "0.6.5"

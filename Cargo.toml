[package]
name = "caocli"
version = "0.1.0"
edition = "2024"
description = "Terminal AI agent backed by DeepSeek with thinking mode and a run_shell tool"
license = "MIT"
repository = "https://github.com/unfallenwill/caocli"

[dependencies]
anyhow = "1.0.104"
bytes = "1.12.1"
chrono = { version = "0.4.45", features = ["clock"] }
clap = { version = "4.6.6", features = ["derive"] }
futures-util = "0.3.34"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "default-tls"] }
rustyline = "18.0.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
wiremock = "0.6.5"
